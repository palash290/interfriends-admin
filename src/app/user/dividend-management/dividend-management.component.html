<div class="hold-transition sidebar-mini"
    [ngClass]="{'skin-blue': checkAdminType(),'skin-red-light': !checkAdminType()}">
    <div class="wrapper">
        <app-header></app-header>
        <app-sidebar></app-sidebar>
        <div class="content-wrapper">
            <section class="content-header">
                <h1>
                    Dividend Management
                </h1>
                <span class="breadcrumb">

                    <button type="button" class="btn btn-dark" data-toggle="modal" data-target="#dividentModal"
                        (click)="onOpenDividend()">
                        Add Dividend
                    </button>
                </span>
            </section>

            <section class="content">
                <div class="row">
                    <div class="col-md-12">
                        <div class="box">
                            <div class="box-header">
                                <h3 class="box-title">Dividend List</h3>
                            </div>
                            <div class="overlay" *ngIf="isLoading">
                                <i class="fa fa-refresh fa-spin"></i>
                            </div>
                            <div class="box-body" *ngIf="isLoading">
                                <mat-spinner class="mx-auto"></mat-spinner>
                            </div>
                            <div class="box-body" *ngIf="lists.length > 0 && !isLoading">
                                <table id="example2" class="table table-bordered table-hover">
                                    <thead>
                                        <tr>
                                            <th>#</th>
                                            <th>Year</th>
                                            <th>Percentage</th>
                                            <th>Description</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr *ngFor="let list of lists">
                                            <td>{{list.sno}}</td>
                                            <td>{{list.dividend_year}}</td>
                                            <td>{{list.percentage}}%</td>
                                            <td>{{list.description}}</td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                            <mat-paginator [length]="totalLists" [pageSize]="listsPerPage"
                                (page)="onChangedPage($event)" *ngIf="lists.length > 0"></mat-paginator>
                            <div class="box-body" *ngIf="lists.length <= 0 && !isLoading">
                                You haven't added any dividends yet!
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        </div>
        <app-footer></app-footer>
    </div>
</div>







<!-- assign mailModal popup start -->
<div class="modal fade" id="dividentModal" tabindex="-1" role="dialog" aria-labelledby="moveModalLabel"
    aria-hidden="true" [ngStyle]="{'display':displayDividend}">
    <form #dividendForm="ngForm" (ngSubmit)="submitDividend(dividendForm)">
        <div class="modal-dialog modal-lg" role="document">
            <div class="modal-content" style="max-width: 800px !important; width: 100% !important;">
                <div class="modal-header">
                    <h1 class="modal-title mb-0 pl-2">Dividend</h1>
                    <button class="close" type="button" data-dismiss="modal" aria-label="Close"
                        (click)="displayDividend = 'none'">
                        <span aria-hidden="true">x</span>
                    </button>
                </div>
                <div class="modal-body">
                    <div class="row">
                        <div class="col-md-4">
                            <div class="form-group"
                                [ngClass]="{'has-error': dividendForm.controls['percentage']?.invalid && dividendForm.controls['percentage']?.touched}">
                                <label>Percentage</label>
                                <select class="form-control" name="percentage" ngModel required>
                                    <option value="" disabled selected>Select percentage</option>
                                    <option *ngFor="let percent of dividendPercentages" [value]="percent">{{ percent }}%
                                    </option>
                                </select>
                                <span class="help-block"
                                    *ngIf="dividendForm.controls['percentage']?.invalid && dividendForm.controls['percentage']?.touched">
                                    Please select a percentage.
                                </span>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="form-group"
                                [ngClass]="{'has-error': dividendForm.controls['dividend_year']?.invalid && dividendForm.controls['dividend_year']?.touched}">
                                <label>Dividend Year</label>
                                <input type="number" class="form-control" placeholder="Enter year (e.g. 2026)"
                                    name="dividend_year" ngModel required />
                                <span class="help-block"
                                    *ngIf="dividendForm.controls['dividend_year']?.invalid && dividendForm.controls['dividend_year']?.touched">
                                    Please enter a dividend year.
                                </span>
                            </div>
                        </div>

                        <div class="col-md-4">
                            <div class="form-group"
                                [ngClass]="{'has-error': dividendForm.controls['description']?.invalid && dividendForm.controls['description']?.touched}">
                                <label>Description</label>
                                <input type="text" class="form-control" placeholder="Enter description"
                                    name="description" ngModel required />
                                <span class="help-block"
                                    *ngIf="dividendForm.controls['description']?.invalid && dividendForm.controls['description']?.touched">
                                    Please enter a description.
                                </span>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="submit" class="btn btn-primary" [disabled]="isLoading">
                        <span *ngIf="!isLoading">
                            <span>Submit</span>
                        </span>
                        <span *ngIf="isLoading">
                            <i class="fa fa-refresh fa-spin"></i>
                        </span>
                    </button>
                    <button class="btn btn-secondary" type="button" data-dismiss="modal" id="closeDividendModal"
                        (click)="displayDividend = 'none'">Close</button>
                </div>
            </div>
        </div>
    </form>
</div>
