<div class="hold-transition sidebar-mini"
  [ngClass]="{'skin-blue': checkAdminType(),'skin-red-light': !checkAdminType()}">
  <div class="wrapper">
    <app-header></app-header>
    <!-- Left side column. contains the logo and sidebar -->
    <app-sidebar></app-sidebar>
    <!-- Content Wrapper. Contains page content -->
    <div class="content-wrapper">
      <!-- image upload s -->
      <div class="ct_banner_table_main ">
        <div class="container">
          <div class="row">
            <div class="col-md-12">
              <section class="content-header ct_content_header">
                <h1 class="mb-0">Banner & Messages</h1>
                <span class="breadcrumb">
                  <button *ngIf="!(addStatus || editStatus)" type="button" data-toggle="modal"
                    data-target="#exampleModal" class="btn bg-maroon" (click)="addBannerAndmessage()"> Add </button>
                  <button *ngIf="(addStatus || editStatus)" type="button" data-toggle="modal"
                    data-target="#exampleModal" class="btn bg-maroon" (click)="Back()"> Back </button>
                </span>
              </section>
              <div *ngIf="!(addStatus || editStatus)" class="ct_banner_table table-responsive box box-primary mt-2">
                <table class="table">
                  <tr>
                    <th>#</th>
                    <th colspan="2">Banner & Messages</th>
                    <!-- <th class="text-right">View</th> -->
                  </tr>
                  <tr *ngFor="let banner of allbannerAndmsg, let i = index">
                    <td>{{i+1}}</td>
                    <td *ngIf="banner.image">

                      <div class="ct_bnr_img" *ngIf="!isVideo(banner.image)">
                        <img [src]="banner.image" alt="Banner Image">
                      </div>

                      <div class="ct_bnr_img" *ngIf="isVideo(banner.image)">
                        <video width="150" controls>
                          <source [src]="banner.image">
                          Your browser does not support the video tag.
                        </video>
                      </div>

                    </td>
                    <td *ngIf="banner.title != ''">{{banner.title}}</td>
                    <td class="ct_buton_grp text-right">
                      <button data-toggle="modal" data-target="#exampleModal" ngbtooltip="Edit"
                        class="btn btn-primary margin" ng-reflect-ngb-tooltip="Edit"
                        (click)="editBannerAndmessage(banner)"><i aria-hidden="true"
                          class="fa fa-pencil-square-o"></i></button>
                      <button (click)="delete(banner.id)" type="button" data-toggle="modal" data-target="#deleteModal"
                        ngbtooltip="Delete" class="btn btn-danger margin" ng-reflect-ngb-tooltip="Delete"><i
                          aria-hidden="true" class="fa fa-trash"></i></button>

                      <button type="button margin" class="btn btn-success margin" data-toggle="modal" ngbTooltip="Block"
                        data-target="#blockModal" (click)="onSetId(banner.id)"
                        *ngIf="banner.status == '1' && adminType == '2'">
                        <i class="fa fa-ban" aria-hidden="true"></i>
                      </button>
                      <button type="button margin" class="btn btn-danger margin" data-toggle="modal"
                        ngbTooltip="UnBlock" data-target="#unblockModal" (click)="onSetUnBlockId(banner.id)"
                        *ngIf="banner.status == '0' && adminType == '2'">
                        <i class="fa fa-ban" aria-hidden="true"></i>
                      </button>

                    </td>
                  </tr>
                </table>
              </div>
            </div>
          </div>
        </div>
      </div>
      <section class="content" *ngIf="editStatus==true || addStatus==true">
        <div class="row">
          <div class="col-md-12">
            <div class="box box-primary">
              <div class="box-header with-border">
                <h3 class="box-title">Update Banner & Messages</h3>
              </div>
              <!-- /.box-header -->
              <!-- form start -->
              <!-- <div class="box-body" >
                  <mat-spinner  class="mx-auto"></mat-spinner>
                </div> -->
              <!-- <div class="overlay">
                  <i class="fa fa-refresh fa-spin"></i>
                </div> -->
              <form [formGroup]="myForm">
                <div class="form-group box-header mb-0">
                  <label>Banner Title</label>
                  <textarea formControlName="title" rows="4" class="form-control"
                    placeholder="Enter Your Message"></textarea>
                </div>
                <!-- <div class="box-footer">
                  <button type="submit" class="btn btn-primary" (click)="submitMessage()">Upload Message</button>
                </div> -->
                <div class="ct_img_upload file-input box-header">
                  <div class="form-group">
                    <label for="file">Banner Image/Video:</label>
                    <input id="file" type="file" class="form-control" accept="image/*,video/*"
                      (change)="onFileChange($event)">
                    <!-- <div *ngIf="f['file'].touched && f['file'].invalid" class="alert alert-danger">
                          <div *ngIf="f['file'].errors && f['file'].errors['required']">File is required.</div>
                      </div> -->
                  </div>
                  <!-- <div class="img"></div> -->
                  <div class="ct_img_grid" *ngFor="let file of imageUrls">
                    <img *ngIf="file.type.startsWith('image/')" [src]="sanitizer.bypassSecurityTrustUrl(file.url)"
                      style="height: 300px; width:500px">
                    <video *ngIf="file.type.startsWith('video/')" [src]="sanitizer.bypassSecurityTrustUrl(file.url)"
                      style="height: 300px; width:500px" controls></video>
                  </div>

                  <div class="ct_img_grid" *ngIf="editStatus==true && imageUrls.length ==0">
                    <img [src]="editImg" style="height: 300px; width:500px">
                  </div>

                  <label for="file">
                    Banner Image/Video:
                    <span style="font-size:11px; color:gray;">(Image max 5 MB, Video max 20 MB)</span>
                  </label>

                </div>
                <div class="box-footer">
                  <!-- <button type="submit" class="btn btn-primary" (click)="submit()">Save</button> -->
                  <button type="submit" (click)="submit()" class="btn btn-primary" [disabled]="isLoading">
                    <span *ngIf="!isLoading">
                      <span>Save</span>
                    </span>
                    <span *ngIf="isLoading">
                      <i class="fa fa-refresh fa-spin"></i>
                    </span>
                  </button>
                </div>
              </form>
            </div>
          </div>
        </div>
        <!-- /.row -->
      </section>
      <!-- image upload E -->
    </div>
    <!-- /.content-wrapper -->
    <app-footer></app-footer>
  </div>
</div>
<!-- ./wrapper -->




<!-- block model popup start -->
<div class="modal fade" id="blockModal" tabindex="-1" role="dialog" aria-labelledby="blockModalLabel" aria-hidden="true"
  [ngStyle]="{'display':displayBlock}">
  <div class="modal-dialog" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <button class="close" type="button" data-dismiss="modal" aria-label="Close">
          <span aria-hidden="true">×</span>
        </button>
      </div>
      <div class="modal-body">Do You Realy Want To Block This Banner</div>
      <div class="modal-footer">
        <button class="btn btn-primary" (click)="onBlockUnblock('0')">BLOCK</button>
        <button class="btn btn-secondary" type="button" data-dismiss="modal" id="closeBlock"
          (click)="onClose()">Close</button>
      </div>
    </div>
  </div>
</div>
<!-- block model popup end -->
<!-- unblock model popup start -->
<div class="modal fade" id="unblockModal" tabindex="-1" role="dialog" aria-labelledby="unblockModalLabel"
  aria-hidden="true" [ngStyle]="{'display':displayUnblock}">
  <div class="modal-dialog" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <button class="close" type="button" data-dismiss="modal" aria-label="Close">
          <span aria-hidden="true">×</span>
        </button>
      </div>
      <div class="modal-body">Do You Realy Want To Unblock This Banner</div>
      <div class="modal-footer">
        <button class="btn btn-primary" (click)="onBlockUnblock('1')">UNBLOCK</button>
        <button class="btn btn-secondary" type="button" data-dismiss="modal" id="closeUnblock"
          (click)="onClose()">Close</button>
      </div>
    </div>
  </div>
</div>
<!-- block model popup end -->
