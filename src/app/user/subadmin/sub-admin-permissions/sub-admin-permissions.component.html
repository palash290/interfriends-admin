<div class="hold-transition sidebar-mini"
    [ngClass]="{'skin-blue': checkAdminType(),'skin-red-light': !checkAdminType()}">
    <div class="wrapper">
        <app-header></app-header>
        <app-sidebar></app-sidebar>
        <div class="content-wrapper">
            <section class="content-header permissions-header">
                <div>
                    <h1>Sub Admin Permissions</h1>
                    <p class="permissions-subtitle">Control access for each sidebar module with one click select-all support.</p>
                </div>
            </section>
            <section class="content">
                <div class="row">
                    <div class="col-md-12">
                        <div class="box permissions-box">
                            <div class="box-body" *ngIf="isLoading">
                                <div class="permissions-loading">
                                    <mat-spinner></mat-spinner>
                                </div>
                            </div>
                            <div class="box-body" *ngIf="!isLoading">
                                <div class="permissions-toolbar">
                                    <label class="select-all-toggle" for="select-all-permissions">
                                        <input
                                            id="select-all-permissions"
                                            type="checkbox"
                                            [checked]="allSelected"
                                            [indeterminate]="indeterminate"
                                            (change)="toggleAll($event)">
                                        <span>
                                            Select all permissions
                                            <small>{{ selectedCount }} of {{ sidebarItems.length }} selected</small>
                                        </span>
                                    </label>
                                    <button class="btn btn-primary" (click)="savePermissions()">
                                        Save Permissions
                                    </button>
                                </div>

                                <div class="permissions-grid">
                                    <label class="permission-card" [class.disabled]="item.id === 1 || item.id === 2" *ngFor="let item of sidebarItems" [for]="'sidebar-' + item.id">
                                        <input
                                            class="permission-checkbox"
                                            type="checkbox"
                                            [id]="'sidebar-' + item.id"
                                            [checked]="item.isChecked"
                                            [disabled]="item.id === 1 || item.id === 2"
                                            (change)="toggleItem(item.id, $event)">
                                        <span class="permission-label">{{ item.name }}</span>
                                    </label>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        </div>
        <app-footer></app-footer>
    </div>
</div>
